<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Focus areas</title>
  <desc id="desc">Three focus lanes: AI agents, content pipelines, and markets systems.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0E11"/>
      <stop offset="100%" stop-color="#10151A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#243039" stroke-width="1.5"/>

  <text x="48" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#7A828C">CURRENT FOCUS</text>
  <text x="48" y="88" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="600" fill="#EDEAE4">Where the flow concentrates</text>

  <g transform="translate(48 120)">
    <rect width="352" height="156" rx="18" fill="#0A0D10" stroke="#243039" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="156" rx="4" fill="#2BB673"/>
    <text x="28" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2" fill="#3CCF8E">01 / AGENTS</text>
    <text x="28" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#EDEAE4">Multi-agent runtimes</text>
    <text x="28" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8A929C">Skills, orchestration,</text>
    <text x="28" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8A929C">and coding teammates</text>
  </g>

  <g transform="translate(424 120)">
    <rect width="352" height="156" rx="18" fill="#0A0D10" stroke="#243039" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="156" rx="4" fill="#E8A838"/>
    <text x="28" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2" fill="#E8A838">02 / PIPELINES</text>
    <text x="28" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#EDEAE4">Content and crawl flows</text>
    <text x="28" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8A929C">Fetch, normalize, digest</text>
    <text x="28" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8A929C">across noisy sources</text>
  </g>

  <g transform="translate(800 120)">
    <rect width="352" height="156" rx="18" fill="#0A0D10" stroke="#243039" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="156" rx="4" fill="#4A5966"/>
    <text x="28" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2" fill="#B7BFC8">03 / SYSTEMS</text>
    <text x="28" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#EDEAE4">Markets and diagrams</text>
    <text x="28" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8A929C">Quant tooling, MCP,</text>
    <text x="28" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8A929C">and architecture maps</text>
  </g>
</svg>
